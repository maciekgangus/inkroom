# The log, metric and alert stack (R-098, ADR 0023, ADR 0024), on a machine of its own: not the one
# that runs the app, so that when that one dies the logs, the history and the alerts are still here
# (and say so). Loki keeps the logs 30 days, Prometheus the metrics, Grafana shows both and sends the
# alerts to Telegram. The agent on the app's machine (deploy/agent/) pushes to Loki and Prometheus.
# Copy this folder to the machine (aarch64 is fine, every image is multi-arch) and put a .env beside
# it (env.template). `docker compose up -d` in this folder.
name: inkroom-observability

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  loki:
    image: grafana/loki:3.6.22
    command: -config.file=/etc/loki/loki.yml
    # Pushed to by the agent over the LAN. No login on this port, so it is published on the LAN
    # address only (LAN_IP), never on every interface.
    ports:
      - "${LAN_IP:?set LAN_IP in .env (the LAN address of this machine)}:${LOKI_PORT:-3100}:3100"
    volumes:
      - loki_data:/loki
      - ./loki.yml:/etc/loki/loki.yml:ro,z
    mem_limit: 512m
    logging: *logging
    restart: unless-stopped

  # Keeps the metrics for 30 days (at most 10 GB); the agent writes to it (remote write) and it
  # scrapes the stack itself. It evaluates nothing: the alerts are Grafana's.
  prometheus:
    image: prom/prometheus:v3.15.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=10GB
      - --web.enable-remote-write-receiver
    # The same: no login, LAN address only.
    ports:
      - "${LAN_IP:?set LAN_IP in .env (the LAN address of this machine)}:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - prometheus_data:/prometheus
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro,z
    mem_limit: 512m
    logging: *logging
    restart: unless-stopped

  # The one place to look: dashboard "Inkroom", Explore for the logs, and the alerts, sent to
  # Telegram. The login is the admin account below; Cloudflare Access stands in front of it.
  grafana:
    image: grafana/grafana:12.4.15
    # Refuses to start without a password rather than starting with Grafana's default one.
    entrypoint:
      - /bin/sh
      - -c
      - '[ -n "$$GF_SECURITY_ADMIN_PASSWORD" ] || { echo "set GF_SECURITY_ADMIN_PASSWORD in .env (deploy/README.md, Logi i alerty)" >&2; exit 1; }; exec /run.sh'
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      # No plugins fetched from the internet at start (Grafana 12 preinstalls a few by default).
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/inkroom.json
      # The Telegram bot of the alerts; the placeholders let Grafana start before it exists.
      TELEGRAM_API_URL: ${TELEGRAM_API_URL:-https://api.telegram.org}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-unset}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-0}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro,z
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro,z
    depends_on:
      - loki
      - prometheus
    mem_limit: 512m
    logging: *logging
    restart: unless-stopped

  # Grafana on its own hostname (logs.<domain>, behind Cloudflare Access), through a tunnel of THIS
  # machine. A tunnel of its own with its own token: never the token of the app's tunnel (the two
  # machines would become replicas of one tunnel and the site's traffic would be split between them).
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in .env (the tunnel of THIS machine, not the app's)}
    depends_on:
      - grafana
    logging: *logging
    restart: unless-stopped

volumes:
  loki_data:
  prometheus_data:
  grafana_data:
