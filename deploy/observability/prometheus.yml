# Prometheus, on the stack's machine (ADR 0024). The metrics of the app, of the app's host and of its
# containers are not scraped from here: the agent on the app's machine scrapes them and pushes them
# (remote write), so no port of the app is reachable from this machine. What is scraped here is the
# stack itself. A new microservice on the app's machine: a scrape block in deploy/agent/.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]
