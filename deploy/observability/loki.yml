# Loki: the logs of every container, kept 30 days on a named volume (ADR 0023). One process, files on
# disk, no object store. The agent pushes to port 3100, published on the LAN address only (ADR 0024).
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

# Old chunks are deleted by the compactor once they are past limits_config.retention_period.
compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
  retention_delete_delay: 2h

limits_config:
  retention_period: 720h # 30 days
  # A runaway service cannot fill the disk in an afternoon: these cap what Loki accepts.
  ingestion_rate_mb: 4
  ingestion_burst_size_mb: 8
  per_stream_rate_limit: 3MB
  per_stream_rate_limit_burst: 6MB
  max_line_size: 256KB
  volume_enabled: true

analytics:
  reporting_enabled: false
