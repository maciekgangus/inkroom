# The app and its tunnel on the VPS (ADR 0003, ADR 0014). Copy this folder to the server and put a
# .env beside it (never in the repo; see env.template). Nothing here opens a port to the internet:
# visitors reach the app through the tunnel, which `cloudflared` dials out from this machine.
services:
  app:
    # The image from the registry, no build. Tracks :latest (the last release); INKROOM_TAG in
    # .env or the environment pins another one (a release such as 0.1.0, or main).
    image: ghcr.io/maciekgangus/inkroom:${INKROOM_TAG:-latest}
    # Reachable from this machine only: update.sh asks /healthz here. The tunnel does not use it.
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - path: .env
        required: false
    volumes:
      - data:/data
    restart: unless-stopped
    # On a machine with no database yet (a new server after a disaster) the app waits for the
    # copy to come back from R2 first; where a database exists this does nothing (ADR 0016).
    depends_on:
      litestream-restore:
        condition: service_completed_successfully

  # Copies the database to R2 all the time, a second after every change (ADR 0016). It works on
  # the same volume as the app, as the same user (the app's files belong to it).
  litestream:
    image: litestream/litestream:0.5.18
    user: "65532:65532"
    command: replicate -config /etc/litestream.yml
    volumes:
      - data:/data
      - ./litestream.yml:/etc/litestream.yml:ro,z
    environment: &r2
      R2_BUCKET: ${R2_BUCKET:?set R2_BUCKET in .env (the R2 bucket for the copies)}
      R2_ENDPOINT: ${R2_ENDPOINT:-https://${R2_ACCOUNT_ID:?set R2_ACCOUNT_ID in .env}.r2.cloudflarestorage.com}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:?set R2_ACCESS_KEY_ID in .env}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:?set R2_SECRET_ACCESS_KEY in .env}
    restart: unless-stopped

  # Runs once before the app: brings the database back from R2 when there is none on the volume.
  litestream-restore:
    image: litestream/litestream:0.5.18
    user: "65532:65532"
    command: restore -config /etc/litestream.yml -if-db-not-exists -if-replica-exists /data/inkroom.db
    volumes:
      - data:/data
      - ./litestream.yml:/etc/litestream.yml:ro,z
    environment: *r2

  # A shell on the volume for restore.sh; not started by `up` (profile tools).
  shell:
    image: busybox:1.37
    profiles: ["tools"]
    volumes:
      - data:/data

  cloudflared:
    image: cloudflare/cloudflared:latest
    # The tunnel's own configuration (which hostname goes to which service) lives in Cloudflare;
    # this container only needs the token, and reaches the app by its name on the compose network.
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in .env (Cloudflare Zero Trust, Networks, Tunnels)}
    depends_on:
      - app
    restart: unless-stopped

volumes:
  data:
