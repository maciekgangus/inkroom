# The app and its tunnel on the VPS (ADR 0003, ADR 0014). Copy this folder to the server and put a
# .env beside it (never in the repo; see env.template). Nothing here opens a port to the internet:
# visitors reach the app through the tunnel, which `cloudflared` dials out from this machine.
# Every service rotates its Docker logs, or they grow until the disk is full (ADR 0022).
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  app:
    # The image from the registry, no build. Tracks :latest (the last release); INKROOM_TAG in
    # .env or the environment pins another one (a release such as 0.1.0, or main).
    image: ghcr.io/maciekgangus/inkroom:${INKROOM_TAG:-latest}
    # Reachable from this machine only: update.sh asks /healthz here. The tunnel does not use it.
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - path: .env
        required: false
    # Logs are JSON lines on stdout (LOG_LEVEL: debug, info, warn, error). /metrics is served on
    # METRICS_ADDR, a port of its own that is not published and not routed by the tunnel; it is
    # reachable on the compose network only (ADR 0022). Empty METRICS_ADDR turns it off.
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      METRICS_ADDR: ${METRICS_ADDR-:9100}
      # Behind the Cloudflare tunnel: trust CF-Connecting-IP / X-Forwarded-Proto (rate limits,
      # secure cookies). Never set this on an instance reachable directly (security audit 2026-11).
      TRUST_PROXY_HEADERS: "1"
    logging: *logging
    volumes:
      - data:/data
    restart: unless-stopped
    # On a machine with no database yet (a new server after a disaster) the app waits for the
    # copy to come back from R2 first; where a database exists this does nothing (ADR 0016).
    depends_on:
      litestream-restore:
        condition: service_completed_successfully

  # Copies the database to R2 all the time, a second after every change (ADR 0016). It works on
  # the same volume as the app, as the same user (the app's files belong to it).
  litestream:
    image: litestream/litestream:0.5.18
    user: "65532:65532"
    command: replicate -config /etc/litestream.yml
    logging: *logging
    volumes:
      - data:/data
      - ./litestream.yml:/etc/litestream.yml:ro,z
    environment: &r2
      R2_BUCKET: ${R2_BUCKET:?set R2_BUCKET in .env (the R2 bucket for the copies)}
      R2_ENDPOINT: ${R2_ENDPOINT:-https://${R2_ACCOUNT_ID:?set R2_ACCOUNT_ID in .env}.r2.cloudflarestorage.com}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:?set R2_ACCESS_KEY_ID in .env}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:?set R2_SECRET_ACCESS_KEY in .env}
    restart: unless-stopped

  # Runs once before the app: brings the database back from R2 when there is none on the volume.
  litestream-restore:
    image: litestream/litestream:0.5.18
    user: "65532:65532"
    command: restore -config /etc/litestream.yml -if-db-not-exists -if-replica-exists /data/inkroom.db
    logging: *logging
    volumes:
      - data:/data
      - ./litestream.yml:/etc/litestream.yml:ro,z
    environment: *r2

  # A shell on the volume for restore.sh; not started by `up` (profile tools).
  shell:
    image: busybox:1.37
    profiles: ["tools"]
    logging: *logging
    volumes:
      - data:/data

  cloudflared:
    # Pinned version, never the mutable latest tag (security audit 2026-11); update on purpose,
    # the nightly update.sh pulls whatever this file names.
    image: cloudflare/cloudflared:2026.11.2
    # The tunnel's own configuration (which hostname goes to which service) lives in Cloudflare;
    # this container only needs the token, and reaches the app by its name on the compose network.
    command: tunnel --no-autoupdate run
    logging: *logging
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in .env (Cloudflare Zero Trust, Networks, Tunnels)}
    depends_on:
      - app
    restart: unless-stopped

  # ------------------------------------------------------------------------------------------
  # Logs, metrics and alerts (R-098, ADR 0023). Off until COMPOSE_PROFILES=observability is set
  # in .env, so the app never depends on any of it and a mistake here cannot touch the nightly
  # update. Nothing below is published to the internet; Grafana is reached through the tunnel
  # (a second hostname behind Cloudflare Access) or, on this machine, at 127.0.0.1:3000.
  # The four services share a budget of about 1.5 GB of memory; the app and Litestream come first.
  # ------------------------------------------------------------------------------------------

  # Keeps the logs of every container for 30 days (Alloy sends them here).
  loki:
    image: grafana/loki:3.6.22
    profiles: ["observability"]
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - loki_data:/loki
      - ./observability/loki.yml:/etc/loki/loki.yml:ro,z
    mem_limit: 384m
    logging: &obs-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  # Reads the logs of the containers through the Docker socket and sends them to Loki; also
  # collects the metrics of the host and of the containers and sends them to Prometheus.
  # The socket gives root on the host to whoever controls this container: it is the pinned
  # official image, with no published port, on the internal network (ADR 0023).
  alloy:
    image: grafana/alloy:v1.21.3
    profiles: ["observability"]
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      # No usage report to grafana.com (it only logs a WARN every time, the egress is blocked).
      - --disable-reporting
      - /etc/alloy/config.alloy
    user: "0:0"
    pid: host
    environment:
      LOG_PROJECT_FILTER: com.docker.compose.project=${COMPOSE_PROJECT_NAME}
    volumes:
      - alloy_data:/var/lib/alloy/data
      - ./observability/config.alloy:/etc/alloy/config.alloy:ro,z
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /:/host:ro,rslave
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    depends_on:
      - loki
      - prometheus
    mem_limit: 384m
    logging: *obs-logging
    restart: unless-stopped

  # Keeps the metrics for 30 days (at most 10 GB) and evaluates nothing itself: the alerts are
  # Grafana's.
  prometheus:
    image: prom/prometheus:v3.15.1
    profiles: ["observability"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=10GB
      - --web.enable-remote-write-receiver
    volumes:
      - prometheus_data:/prometheus
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro,z
    mem_limit: 384m
    logging: *obs-logging
    restart: unless-stopped

  # The one place to look: dashboard "Inkroom", Explore for the logs, and the alerts, sent to
  # Telegram. The login is the admin account below; Cloudflare Access stands in front of it.
  grafana:
    image: grafana/grafana:12.4.15
    profiles: ["observability"]
    # Refuses to start without a password rather than starting with Grafana's default one.
    entrypoint:
      - /bin/sh
      - -c
      - '[ -n "$$GF_SECURITY_ADMIN_PASSWORD" ] || { echo "set GF_SECURITY_ADMIN_PASSWORD in .env (deploy/README.md, Logi i alerty)" >&2; exit 1; }; exec /run.sh'
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      # No plugins fetched from the internet at start (Grafana 12 preinstalls a few by default).
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/inkroom.json
      # The Telegram bot of the alerts; the placeholders let Grafana start before it exists.
      TELEGRAM_API_URL: ${TELEGRAM_API_URL:-https://api.telegram.org}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-unset}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-0}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro,z
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro,z
    depends_on:
      - loki
      - prometheus
    mem_limit: 384m
    logging: *obs-logging
    restart: unless-stopped

volumes:
  data:
  loki_data:
  prometheus_data:
  alloy_data:
  grafana_data:
