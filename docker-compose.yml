# LOKALNIE: buduje obraz ze źródeł (`docker compose up`). Na serwerze tego pliku się nie używa,
# tylko deploy/docker-compose.yml (gotowy obraz z GHCR i tunel Cloudflare, ADR 0014).
services:
  app:
    build: .
    ports:
      - "${PORT:-8080}:8080"
    env_file:
      - path: .env
        required: false
    volumes:
      - data:/data
    restart: unless-stopped

volumes:
  data:
