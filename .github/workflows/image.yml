# Tests every change and publishes the app's image to the GitHub Container Registry (ADR 0014).
#   pull request     tests only, nothing is published
#   push to main     tests, then the image :main and :sha-<commit>
#   tag v1.2.3       tests, then the image :1.2.3, :1.2 and :latest (what the VPS follows)
name: image

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# A newer run of the same branch makes an older one pointless; a tag build is never cancelled.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job gets read-only by default; only the image job adds packages: write (security audit
# 2026-11).
permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Server
        working-directory: server
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...

      - name: Update script of the VPS
        run: sh deploy/test-update.sh
      - name: Compose file of the VPS
        # It must read with its keys (also with the SELinux file) and refuse to start without them.
        run: |
          export TUNNEL_TOKEN=dummy R2_ACCOUNT_ID=a R2_BUCKET=b R2_ACCESS_KEY_ID=k R2_SECRET_ACCESS_KEY=s
          docker compose -f deploy/docker-compose.yml config --quiet
          COMPOSE_FILE=deploy/docker-compose.yml:deploy/docker-compose.selinux.yml docker compose config --quiet
          (unset TUNNEL_TOKEN R2_BUCKET; ! docker compose -f deploy/docker-compose.yml config --quiet)

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Client
        working-directory: web
        run: |
          npm ci
          npx biome check .
          npm test
          npm run build

  image:
    needs: test
    # Only what is on main or has a release tag is published, never a pull request.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE }}
          # latest is only ever a release: the branch builds are :main and :sha-<commit>.
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Scans the published image for known vulnerabilities (security audit 2026-11). Fails on
  # unfixed CRITICAL/HIGH, so a bad base image blocks the release until it is fixed.
  scan:
    needs: image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      # The image is private: without a login Trivy cannot pull it (UNAUTHORIZED).
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ env.IMAGE }}:sha-${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
